<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI KINO STUDIO 555</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b14;color:#fff;font-family:Arial,sans-serif}
header{padding:22px 18px;background:linear-gradient(120deg,#18213a,#10121c);border-bottom:1px solid #30384c}
.logo{font-size:24px;font-weight:900;color:#f5bd55}
header p{color:#aab4c8;font-size:13px}
main{padding:16px;max-width:850px;margin:auto}
h2{font-size:21px}
.modules{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.module{background:#151c2d;border:1px solid #303b54;border-radius:13px;padding:16px;color:white;text-align:left;min-height:105px}
.module.active{border:2px solid #e9ae42;background:#27243a}
.module strong{display:block;margin:8px 0}
.module small{color:#aab4c8}
.card{background:#141b2b;border:1px solid #303b54;border-radius:15px;padding:17px;margin-top:17px}
label{display:block;margin:15px 0 7px;color:#dce2ef;font-size:14px}
input,textarea,select{width:100%;padding:13px;border-radius:9px;border:1px solid #3a4660;background:#0c1220;color:white;font-size:15px}
textarea{resize:vertical}
button{cursor:pointer}
.primary{width:100%;padding:16px;border:0;border-radius:10px;background:#eab34c;color:#111;font-size:16px;font-weight:bold;margin-top:18px}
.secondary{padding:10px;border:1px solid #46516a;border-radius:8px;background:#202a40;color:white}
.status{color:#c4cce0;line-height:1.6;white-space:pre-wrap}
footer{text-align:center;color:#71809b;padding:25px;font-size:12px}
@media(min-width:650px){.modules{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header>
<div class="logo">🎬 AI KINO STUDIO 555</div>
<p>Universal AI Creator — Kino, musiqa, multfilm va yangiliklar</p>
</header>

<main>
<h2>Ijod turini tanlang</h2>
<div class="modules">
<button class="module active" data-type="Kino" onclick="choose(this)">
🎬 <strong>KINO YARATISH</strong><small>Realistik filmlar va seriallar</small>
</button>
<button class="module" data-type="Qo‘shiq" onclick="choose(this)">
🎵 <strong>QO‘SHIQ YARATISH</strong><small>Rep, pop va boshqa janrlar</small>
</button>
<button class="module" data-type="Multfilm" onclick="choose(this)">
🧸 <strong>MULTFILM YARATISH</strong><small>3D animatsiya va hikoyalar</small>
</button>
<button class="module" data-type="Jahon yangiliklari" onclick="choose(this)">
🌍 <strong>JAHON YANGILIKLARI</strong><small>So‘nggi xabarlar va tahlillar</small>
</button>
<button class="module" data-type="Futbol yangiliklari" onclick="choose(this)">
⚽ <strong>FUTBOL YANGILIKLARI</strong><small>Natijalar, transferlar va tahlil</small>
</button>
<button class="module" data-type="Hujjatli film" onclick="choose(this)">
🎥 <strong>HUJJATLI FILM</strong><small>Tarix, tabiat va texnologiya</small>
</button>
</div>

<section class="card">
<h2 id="formTitle">🎬 Yangi kino loyihasi</h2>

<label>Kino yoki loyiha mavzusi</label>
<textarea id="topic" rows="4" placeholder="Mavzuni shu yerga yozing..."></textarea>

<label>Kontent tili</label>
<select id="language">
<option value="O‘zbekcha">🇺🇿 O‘zbekcha</option>
<option value="Русский">🇷🇺 Русский</option>
<option value="English">🇬🇧 English</option>
</select>

<label>Davomiyligi</label>
<select id="duration">
<option>1–3 daqiqa</option>
<option>5–10 daqiqa</option>
<option>15–30 daqiqa</option>
<option selected>30–60 daqiqa</option>
<option>1–2 soat</option>
</select>

<label>Video formati</label>
<select id="format">
<option>YouTube — 16:9</option>
<option>Instagram Reels — 9:16</option>
<option>YouTube Shorts — 9:16</option>
<option>Instagram Post — 1:1</option>
</select>

<label>Uslub</label>
<select id="style">
<option>Realistik, professional cinematic</option>
<option>Hujjatli film</option>
<option>3D animatsiya</option>
<option>Yangiliklar studiyasi</option>
<option>Jangari va sarguzasht</option>
<option>Romantik va drama</option>
<option>Komediya</option>
</select>

<label>Qo‘shimcha talablar</label>
<textarea id="extra" rows="3" placeholder="Masalan: professional diktor, subtitr, dramatik musiqa..."></textarea>

<button class="primary" onclick="createProject()">🚀 LOYIHANI BOSHLASH</button>
</section>

<section class="card">
<h2>📋 Loyiha topshirig‘i</h2>
<div id="result" class="status">Hozircha loyiha tanlanmagan.</div>
</section>

<footer>AI KINO STUDIO 555 • Universal Creative Platform</footer>
</main>

<script>
let selected="Kino";

function choose(button){
document.querySelectorAll(".module").forEach(b=>b.classList.remove("active"));
button.classList.add("active");
selected=button.dataset.type;
document.getElementById("formTitle").textContent="✨ Yangi "+selected+" loyihasi";
}

function createProject(){
const topic=document.getElementById("topic").value.trim();
if(!topic){
alert("Avval mavzuni yozing!");
return;
}
const data={
type:selected,
topic:topic,
language:document.getElementById("language").value,
duration:document.getElementById("duration").value,
format:document.getElementById("format").value,
style:document.getElementById("style").value,
extra:document.getElementById("extra").value
};
document.getElementById("result").textContent=
"LOYIHA TOPSHIRIG‘I\n\n"+
"Yo‘nalish: "+data.type+"\n"+
"Mavzu: "+data.topic+"\n"+
"Til: "+data.language+"\n"+
"Davomiylik: "+data.duration+"\n"+
"Format: "+data.format+"\n"+
"Uslub: "+data.style+"\n"+
"Talablar: "+data.extra+
"\n\nLoyiha topshirig‘i tayyor. Haqiqiy ssenariy, ovoz va video yaratish uchun AI xizmatlari API orqali ulanishi kerak.";
}
</script>
</body>
</html>
