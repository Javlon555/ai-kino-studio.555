
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI KINO STUDIO 555</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b14;color:white;font-family:Arial}
header{padding:24px;background:linear-gradient(120deg,#202d49,#111522)}
.logo{font-size:25px;font-weight:bold;color:#f5bd55}
header p{color:#b6c1d5}
main{padding:16px;max-width:850px;margin:auto}
.modules{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.module,.card{background:#171f32;color:white;border:1px solid #34415d;border-radius:13px;padding:16px}
.module{text-align:left;min-height:90px}
.module.active{border:2px solid #efb94e}
.module strong{display:block;margin:8px 0}
.card{margin-top:18px}
label{display:block;margin:15px 0 7px}
input,textarea,select{width:100%;padding:13px;background:#0b1221;color:white;border:1px solid #43516d;border-radius:9px;font-size:15px}
button{cursor:pointer}
.primary,.secondary{width:100%;padding:15px;border:0;border-radius:9px;margin-top:12px;font-weight:bold}
.primary{background:#eab34c;color:#111}
.secondary{background:#26334d;color:white}
.note{font-size:13px;color:#aebbd0;line-height:1.5}
#status{margin-top:15px;color:#f5bd55;line-height:1.5}
#result{white-space:pre-wrap;line-height:1.5;overflow-wrap:anywhere}
video{width:100%;margin-top:15px}
@media(min-width:650px){.modules{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header>
<div class="logo">🎬 AI KINO STUDIO 555</div>
<p>Kling AI Video Generator</p>
</header>
<main>
<h2>🎥 Ijod turini tanlang</h2>
<div class="modules">
<button class="module active" data-type="Kino" onclick="choose(this)">🎬<strong>KINO</strong>Realistik filmlar</button>
<button class="module" data-type="Qo‘shiq" onclick="choose(this)">🎵<strong>QO‘SHIQ</strong>Musiqiy kliplar</button>
<button class="module" data-type="Multfilm" onclick="choose(this)">🧸<strong>MULTFILM</strong>3D animatsiya</button>
<button class="module" data-type="Jahon yangiliklari" onclick="choose(this)">🌍<strong>YANGILIKLAR</strong>Dunyo xabarlari</button>
<button class="module" data-type="Futbol" onclick="choose(this)">⚽<strong>FUTBOL</strong>Sport videolari</button>
<button class="module" data-type="Hujjatli film" onclick="choose(this)">🎥<strong>HUJJATLI FILM</strong>Tarix va tabiat</button>
</div>

<section class="card">
<h2 id="heading">🎬 Yangi kino yaratish</h2>

<label>Video mavzusi</label>
<textarea id="topic" rows="4" placeholder="Qanday video yaratamiz?"></textarea>

<label>Prompt tili</label>
<select id="language">
<option>English</option>
<option>O‘zbekcha</option>
<option>Русский</option>
</select>

<label>Video davomiyligi</label>
<select id="duration">
<option value="5">5 soniya</option>
<option value="10">10 soniya</option>
<option value="15">15 soniya</option>
</select>

<label>Video formati</label>
<select id="format">
<option value="16:9">YouTube 16:9</option>
<option value="9:16">Shorts 9:16</option>
<option value="1:1">Kvadrat 1:1</option>
</select>

<label>Video uslubi</label>
<select id="style">
<option>Ultra realistic cinematic</option>
<option>Hollywood movie style</option>
<option>3D animation</option>
<option>Documentary film</option>
<option>News studio</option>
<option>Professional music video</option>
</select>

<label>Qo‘shimcha talablar</label>
<textarea id="extra" rows="3" placeholder="Kamera, aktyorlar, muhit..."></textarea>

<label>Maxfiy ilova paroli</label>
<input id="appPassword" type="password" autocomplete="off" placeholder="O‘zingiz belgilagan parol">

<p class="note">Kling AI video yaratish uchun hisobingizda yetarli kredit bo‘lishi kerak. Maxfiy parolingizni hech kimga bermang.</p>

<button class="secondary" onclick="makePrompt()">📝 PROMPT TAYYORLASH</button>
<button class="primary" id="createBtn" onclick="createVideo()">🚀 KLING AI ORQALI VIDEO YARATISH</button>

<div id="status"></div>
<video id="video" controls playsinline hidden></video>
</section>

<section class="card">
<h2>📋 Video prompti</h2>
<div id="result">Avval video mavzusini kiriting.</div>
<button class="secondary" onclick="copyResult()">📋 NUSXALASH</button>
</section>
</main>

<script>
let selected="Kino";

function choose(btn){
document.querySelectorAll(".module").forEach(x=>x.classList.remove("active"));
btn.classList.add("active");
selected=btn.dataset.type;
document.getElementById("heading").textContent=selected+" loyihasi";
}

function buildPrompt(){
const topic=document.getElementById("topic").value.trim();
if(!topic) throw new Error("Avval video mavzusini yozing.");

const style=document.getElementById("style").value;
const extra=document.getElementById("extra").value;
const lang=document.getElementById("language").value;

let prompt=lang==="English"
? "Create a professional "+style+" video. Project: "+selected+". Scene: "+topic+". Cinematic composition, realistic movement, detailed environment, natural lighting, smooth camera movement. "+extra
: "Loyiha: "+selected+". Mavzu: "+topic+". Uslub: "+style+". "+extra;

return prompt.slice(0,2500);
}

function makePrompt(){
try{
document.getElementById("result").textContent=buildPrompt();
}catch(e){alert(e.message);}
}

async function createVideo(){
const btn=document.getElementById("createBtn");
const status=document.getElementById("status");
const video=document.getElementById("video");
const password=document.getElementById("appPassword").value;

if(!password){alert("Maxfiy parolni kiriting.");return;}

let prompt;
try{prompt=buildPrompt();}
catch(e){alert(e.message);return;}

document.getElementById("result").textContent=prompt;
btn.disabled=true;
btn.textContent="⏳ KUTILMOQDA...";
status.textContent="Kling AI’ga so‘rov yuborilmoqda...";
video.hidden=true;
video.removeAttribute("src");

try{
const response=await fetch("/api/kling",{
method:"POST",
headers:{
"Content-Type":"application/json",
"x-app-password":password
},
body:JSON.stringify({
prompt:prompt,
duration:Number(document.getElementById("duration").value),
aspectRatio:document.getElementById("format").value
})
});

const data=await response.json();
if(!response.ok) throw new Error(data.error||"Kling xatosi.");

const task=data.task||{};
const taskId=String(task.id||task.task_id||"");
if(!taskId) throw new Error("Vazifa ID topilmadi.");

status.textContent="Video tayyorlanmoqda...";

let done=false;

for(let i=0;i<60;i++){
await new Promise(resolve=>setTimeout(resolve,10000));

const check=await fetch(
"/api/kling?taskId="+encodeURIComponent(taskId),
{headers:{"x-app-password":password}}
);

const result=await check.json();
if(!check.ok) throw new Error(result.error||"Holatni tekshirish xatosi.");

const t=result.task||{};
const state=String(t.status||t.task_status||"").toLowerCase();

if(["succeed","success","completed","complete"].includes(state)){
const outputs=t.outputs||t.output||{};
const first=Array.isArray(outputs)?outputs[0]:outputs;
const url=first?.url||first?.video_url||t.video_url||t.url;

if(!url) throw new Error("Video havolasi topilmadi.");

video.src=url;
video.hidden=false;
status.textContent="✅ Video tayyor!";
done=true;
break;
}

if(["failed","fail","error"].includes(state)){
throw new Error(t.message||"Kling video yaratolmadi.");
}

status.textContent="Video tayyorlanmoqda: "+(i+1)+" / 60";
}

if(!done) status.textContent="Video hali tayyor emas. Keyinroq tekshiring.";

}catch(e){
status.textContent="Xatolik: "+e.message;
}finally{
btn.disabled=false;
btn.textContent="🚀 KLING AI ORQALI VIDEO YARATISH";
}
}

function copyResult(){
const t=document.getElementById("result").textContent;
if(navigator.clipboard){
navigator.clipboard.writeText(t).then(()=>alert("Nusxalandi!"));
}else{alert("Matnni belgilab nusxalang.");}
}
</script>
</body>
</html>
